name: remind_me
description: Remind Me
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database (typed SQLite)
  drift: ^2.34.3
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.3
  path: ^1.9.0

  # Local notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

  # Media
  image_picker: ^1.1.2
  # 5.x resolves a record_linux that no longer satisfies
  # record_platform_interface, which breaks the Dart kernel compile even when
  # building for Android/iOS. 7.x ships a consistent federated set.
  record: ^7.1.1
  just_audio: ^0.9.40
  permission_handler: ^11.3.1

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^11.0.0

  # UI / UX
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8

  # Backup (zip)
  archive: ^3.6.1
  share_plus: ^13.3.0
  # 8.x hardcodes compileSdk 34, which fails AAR metadata checks against
  # flutter_plugin_android_lifecycle (needs 36+).
  file_picker: ^12.0.0

  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  mocktail: ^1.0.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/