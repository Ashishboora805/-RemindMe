org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# flutter_secure_storage 11 requires its dependents to compile against API 37,
# which is one above AGP 9.1.0's "maximum recommended" compileSdk. Compiling
# against a newer SDK is backward compatible and targetSdk is unchanged, so the
# warning is acknowledged rather than worked around.
android.suppressUnsupportedCompileSdk=37
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler memory-maps its cache files, and on Windows it
# regularly fails to release them again ("Could not close incremental caches in
# …/caches-jvm/jvm/kotlin"), which fails the build for whichever plugin module
# hit it. Plugin sources never change between builds, so incremental Kotlin
# compilation buys us nothing here. Remove this if you build on Linux/macOS and
# want the faster plugin recompiles.
kotlin.incremental=false
